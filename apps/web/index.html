<!doctype html>
<html lang="en" data-theme="dossier">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genetiq — 3D Genome Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme/CRT before first paint to avoid a flash.
      try {
        var st = JSON.parse(localStorage.getItem("genetiq.settings.v1") || "{}");
        var el = document.documentElement;
        el.dataset.theme = st.theme || "dossier";
        el.dataset.crt = st.crt === false ? "off" : "on";
        el.dataset.motion = st.reducedMotion ? "reduced" : "full";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
